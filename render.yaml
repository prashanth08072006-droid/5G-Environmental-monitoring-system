services:
  - type: web
    name: ecowatch-india-5g
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node backend/src/server.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
