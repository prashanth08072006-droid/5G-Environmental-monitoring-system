<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoSense 5G — Environmental Intelligence & Real-Time Monitoring Platform</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            orangeBrand: '#FF6600',
            orangeDeep: '#EA580C',
            orangeLight: '#FFF7ED',
            orangeBorder: '#FED7AA'
          }
        }
      }
    };
  </script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <style>
    :root {
      /* Primary Default Theme: High-Tech Orange & White with Black Text */
      --bg-body: #FFFFFF;
      --bg-sidebar: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-card-hover: #FFF7ED;
      --bg-inner: #FFF7ED;
      --border-color: #FED7AA;
      --border-focus: #EA580C;
      --accent-primary: #EA580C;
      --accent-secondary: #FF6600;
      --accent-gradient: linear-gradient(135deg, #FF6600 0%, #EA580C 100%);
      --text-main: #000000;
      --text-muted: #18181B;
      --glow-color: rgba(234, 88, 12, 0.22);
    }

    [data-theme="solar"] {
      --bg-body: #FFFFFF;
      --bg-sidebar: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-card-hover: #FEF3C7;
      --bg-inner: #FFFBEB;
      --border-color: #FDE68A;
      --border-focus: #D97706;
      --accent-primary: #D97706;
      --accent-secondary: #F59E0B;
      --accent-gradient: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
      --text-main: #000000;
      --text-muted: #18181B;
      --glow-color: rgba(217, 119, 6, 0.22);
    }

    [data-theme="coral"] {
      --bg-body: #FFFFFF;
      --bg-sidebar: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-card-hover: #FFF1F2;
      --bg-inner: #FFF1F2;
      --border-color: #FECDD3;
      --border-focus: #E11D48;
      --accent-primary: #E11D48;
      --accent-secondary: #FF4D6D;
      --accent-gradient: linear-gradient(135deg, #FF4D6D 0%, #E11D48 100%);
      --text-main: #000000;
      --text-muted: #18181B;
      --glow-color: rgba(225, 29, 72, 0.22);
    }

    [data-theme="sunset"] {
      --bg-body: #FFFFFF;
      --bg-sidebar: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-card-hover: #FFF7ED;
      --bg-inner: #FFF7ED;
      --border-color: #FED7AA;
      --border-focus: #C2410C;
      --accent-primary: #C2410C;
      --accent-secondary: #EA580C;
      --accent-gradient: linear-gradient(135deg, #EA580C 0%, #9A3412 100%);
      --text-main: #000000;
      --text-muted: #18181B;
      --glow-color: rgba(194, 65, 12, 0.22);
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-body);
      color: #000000 !important;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Strict Black Typography for Maximum Readability */
    h1, h2, h3, h4, h5, h6 {
      color: #000000 !important;
      font-weight: 800 !important;
    }

    p, span, label, td, th {
      color: #000000;
    }

    .text-slate-400, .text-slate-500, .text-slate-600 {
      color: #18181B !important;
      font-weight: 500;
    }
    .text-slate-300, .text-slate-200, .text-slate-100 {
      color: #000000 !important;
    }
    .text-slate-700, .text-slate-800, .text-slate-900 {
      color: #000000 !important;
    }

    .bg-slate-800, .bg-slate-900, .bg-slate-950, .bg-slate-800\/60, .bg-slate-800\/40 {
      background-color: #FED7AA !important;
    }

    input, select, textarea {
      background-color: #FFFFFF !important;
      color: #000000 !important;
      border: 1.5px solid var(--border-color) !important;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #EA580C !important;
      outline: none;
      box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.2) !important;
    }

    .font-mono { font-family: 'JetBrains Mono', monospace; }

    /* Orange and White Themed Cards */
    .themed-card {
      background-color: #FFFFFF !important;
      border: 1.5px solid var(--border-color) !important;
      box-shadow: 0 4px 20px -2px rgba(234, 88, 12, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      color: #000000 !important;
    }
    .themed-card:hover {
      border-color: var(--border-focus) !important;
      box-shadow: 0 10px 30px -4px rgba(234, 88, 12, 0.22);
      background-color: var(--bg-card-hover) !important;
    }

    /* Crisp White Sidebar with Orange Border */
    .themed-sidebar {
      background-color: #FFFFFF !important;
      border-right: 1.5px solid var(--border-color) !important;
      box-shadow: 3px 0 20px rgba(234, 88, 12, 0.04);
      color: #000000 !important;
    }

    /* Orange Inset Containers */
    .themed-inner {
      background-color: var(--bg-inner) !important;
      border: 1.5px solid var(--border-color) !important;
      color: #000000 !important;
    }

    /* Vibrant Orange Action Buttons */
    .themed-gradient-btn {
      background: var(--accent-gradient) !important;
      color: #FFFFFF !important;
      font-weight: 800 !important;
      box-shadow: 0 4px 16px var(--glow-color);
      border: none;
      transition: opacity 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    .themed-gradient-btn:hover {
      opacity: 0.94;
      transform: translateY(-1px);
      box-shadow: 0 6px 22px var(--glow-color);
    }
    .themed-gradient-btn * {
      color: #FFFFFF !important;
    }

    .themed-accent-text {
      color: var(--accent-primary) !important;
      font-weight: 800;
    }

    /* Navigation item active state */
    .themed-nav-active {
      background: #FFF7ED !important;
      color: #EA580C !important;
      border: 1.5px solid #EA580C !important;
      box-shadow: 0 2px 12px rgba(234, 88, 12, 0.16) !important;
      font-weight: 800 !important;
    }
    .themed-nav-active * {
      color: #EA580C !important;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px var(--accent-primary)); }
      50% { transform: scale(1.15); filter: drop-shadow(0 0 18px var(--accent-primary)); }
    }
    .pulse-glow { animation: pulseGlow 1.8s infinite ease-in-out; }

    /* Custom AQI Marker Pin with Crisp White Border & Black Text */
    .aqi-marker-pin {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #FFFFFF; font-weight: 900; font-size: 11px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.3); border: 2.5px solid #FFFFFF;
      cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .aqi-marker-pin:hover {
      transform: scale(1.25) translateY(-3px);
      box-shadow: 0 6px 20px rgba(234, 88, 12, 0.6);
    }

    /* Leaflet Popups: White background with Orange Border & Black Text */
    .leaflet-popup-content-wrapper {
      background: #FFFFFF !important;
      color: #000000 !important;
      border-radius: 16px !important;
      border: 2px solid #EA580C !important;
      box-shadow: 0 12px 36px rgba(234, 88, 12, 0.25) !important;
      padding: 6px !important;
    }
    .leaflet-popup-tip { background: #FFFFFF !important; }

    /* Leaflet Container */
    .leaflet-container {
      width: 100% !important;
      height: 100% !important;
      background: #aad3df !important; /* Ocean Blue background for clear Indian peninsula definition */
    }
  </style>
</head>
<body class="antialiased min-h-screen selection:bg-orange-500 selection:text-white bg-white text-black">
  
  <div id="app" class="flex h-screen overflow-hidden bg-white">
    <!-- Initial Loader -->
    <div id="loader" class="flex-1 flex flex-col items-center justify-center p-6 text-center bg-white">
      <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-3xl shadow-xl pulse-glow mb-4" style="background: var(--accent-gradient);">
        ⚡
      </div>
      <h2 class="text-xl font-black text-black tracking-tight">EcoSense 5G Platform</h2>
      <p class="text-xs text-black mt-1 font-mono font-bold">Synchronizing 5G Sub-6GHz Telemetry & CPCB NAQI Engine...</p>
    </div>
  </div>

  <div id="modal-container"></div>

  <script>
    const API_BASE = '/api';

    // Application State
    let initialTheme = localStorage.getItem('ecosense_theme');
    if (!initialTheme || ['cyber', 'sapphire', 'aurora', 'light'].includes(initialTheme)) {
      initialTheme = 'orange';
      localStorage.setItem('ecosense_theme', 'orange');
    }

    const state = {
      theme: initialTheme,
      currentTab: 'dashboard',
      activeCityFilter: 'ALL',
      devices: [],
      locations: [],
      summary: null,
      currentAqiData: null,
      networkStats: null,
      alerts: [],
      alertRules: [],
      hotspots: [],
      predictions: null,
      liveStreamConnected: false,
      lastSimulatedPacket: null,
      currentUser: {
        id: 'usr_admin',
        name: 'Dr. Aarav Sharma',
        role: 'ADMIN',
        department: 'Central Environmental Board'
      },
      aiMessages: [
        { sender: 'assistant', text: 'Greetings! I am **EcoSense AI**, connected directly to our 5G IoT environmental sensor network. Ask me about air quality, hotspots, 5G latency, or sensor health.' }
      ],
      selectedStation: null,
      selectedStationHistory: [],
      reportData: null,
      leafletMap: null,
      miniMap: null,
      fullMapGroup: null,
      miniMapGroup: null,
      fullMapMarkers: {},
      miniMapMarkers: {}
    };

    function applyTheme(themeKey) {
      state.theme = themeKey;
      localStorage.setItem('ecosense_theme', themeKey);
      if (themeKey === 'orange') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', themeKey);
      }
      renderApp();
    }

    function getAqiBadge(aqi) {
      if (aqi <= 50) return { label: 'Good', bg: 'bg-emerald-100 text-emerald-950 border border-emerald-400 font-black', color: '#10B981' };
      if (aqi <= 100) return { label: 'Satisfactory', bg: 'bg-teal-100 text-teal-950 border border-teal-400 font-black', color: '#0D9488' };
      if (aqi <= 200) return { label: 'Moderate', bg: 'bg-amber-100 text-amber-950 border border-amber-400 font-black', color: '#D97706' };
      if (aqi <= 300) return { label: 'Poor', bg: 'bg-orange-100 text-orange-950 border border-orange-500 font-black', color: '#EA580C' };
      if (aqi <= 400) return { label: 'Very Poor', bg: 'bg-rose-100 text-rose-950 border border-rose-400 font-black', color: '#E11D48' };
      return { label: 'Severe', bg: 'bg-purple-100 text-purple-950 border border-purple-400 font-black', color: '#9333EA' };
    }

    async function fetchAllData() {
      try {
        const [devsRes, locsRes, aqiRes, sumRes, netRes, altRes, rulesRes, hotRes, predRes] = await Promise.all([
          fetch(`${API_BASE}/devices`).then(r => r.json()),
          fetch(`${API_BASE}/locations`).then(r => r.json()),
          fetch(`${API_BASE}/aqi/current`).then(r => r.json()),
          fetch(`${API_BASE}/analytics/summary`).then(r => r.json()),
          fetch(`${API_BASE}/network/stats`).then(r => r.json()),
          fetch(`${API_BASE}/alerts`).then(r => r.json()),
          fetch(`${API_BASE}/alerts/rules`).then(r => r.json()),
          fetch(`${API_BASE}/analytics/hotspots`).then(r => r.json()),
          fetch(`${API_BASE}/predictions`).then(r => r.json())
        ]);

        state.devices = devsRes;
        state.locations = locsRes;
        state.currentAqiData = aqiRes;
        state.summary = sumRes;
        state.networkStats = netRes;
        state.alerts = altRes;
        state.alertRules = rulesRes;
        state.hotspots = hotRes;
        state.predictions = predRes;
        renderApp();
      } catch (err) {
        console.error('Fetch error:', err);
        renderError('Failed to connect to EcoSense 5G backend API.');
      }
    }

    // Connect SSE Stream with Live Map Simulation
    function initSSE() {
      try {
        const eventSource = new EventSource(`${API_BASE}/stream`);
        eventSource.onopen = () => {
          state.liveStreamConnected = true;
          updateLivePill();
        };
        eventSource.onmessage = (event) => {
          try {
            const parsed = JSON.parse(event.data);
            if (parsed.type === 'TELEMETRY_PACKET') {
              const { measurement, device } = parsed.data;
              state.lastSimulatedPacket = { measurement, device };

              const idx = state.devices.findIndex(d => d.deviceId === device.deviceId);
              if (idx !== -1) {
                state.devices[idx] = { ...state.devices[idx], ...device, latestMeasurement: measurement };
              }

              // Update Dashboard live elements
              if (state.currentTab === 'dashboard') {
                updateDashboardLiveElements(measurement, device);
              }

              // Update Map Markers with Live Ping Simulation
              updateMapLiveMarker(measurement, device);
              updateMapSimulationTicker(measurement, device);

            } else if (parsed.type === 'NEW_ALERT') {
              state.alerts.unshift(parsed.data);
              renderApp();
            } else if (parsed.type === 'ALERT_RESOLVED') {
              const alt = state.alerts.find(a => a.id === parsed.data.id);
              if (alt) alt.status = 'RESOLVED';
              renderApp();
            }
          } catch (e) {
            console.error('SSE packet parse error:', e);
          }
        };
        eventSource.onerror = () => {
          state.liveStreamConnected = false;
          updateLivePill();
        };
      } catch (e) {
        console.warn('SSE unsupported:', e);
      }
    }

    // Live Map Simulation Pin Animation
    function updateMapLiveMarker(meas, dev) {
      const badge = getAqiBadge(meas.aqi);
      const loc = state.locations.find(l => l.id === dev.locationId);

      // Mini map marker update
      if (state.miniMapMarkers[dev.deviceId]) {
        const m = state.miniMapMarkers[dev.deviceId];
        m.setIcon(L.divIcon({
          className: 'custom-aqi-icon',
          html: `<div class="aqi-marker-pin pulse-glow" style="background-color: ${badge.color}; box-shadow: 0 0 25px ${badge.color};">${meas.aqi}</div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        }));
        setTimeout(() => {
          m.setIcon(L.divIcon({
            className: 'custom-aqi-icon',
            html: `<div class="aqi-marker-pin" style="background-color: ${badge.color}">${meas.aqi}</div>`,
            iconSize: [34, 34],
            iconAnchor: [17, 17]
          }));
        }, 1800);
      }

      // Fullscreen map marker update
      if (state.fullMapMarkers[dev.deviceId]) {
        const m = state.fullMapMarkers[dev.deviceId];
        m.setIcon(L.divIcon({
          className: 'custom-aqi-icon',
          html: `<div class="aqi-marker-pin pulse-glow" style="background-color: ${badge.color}; box-shadow: 0 0 30px ${badge.color}; transform: scale(1.25);">${meas.aqi}</div>`,
          iconSize: [40, 40],
          iconAnchor: [20, 20]
        }));

        m.setPopupContent(buildPopupHtml(dev, loc, meas, badge));

        setTimeout(() => {
          m.setIcon(L.divIcon({
            className: 'custom-aqi-icon',
            html: `<div class="aqi-marker-pin" style="background-color: ${badge.color}; box-shadow: 0 0 16px ${badge.color}aa;">${meas.aqi}</div>`,
            iconSize: [36, 36],
            iconAnchor: [18, 18]
          }));
        }, 1800);
      }
    }

    function updateMapSimulationTicker(meas, dev) {
      const ticker = document.getElementById('map-simulation-ticker');
      if (ticker) {
        const loc = state.locations.find(l => l.id === dev.locationId);
        const badge = getAqiBadge(meas.aqi);
        ticker.innerHTML = `
          <div class="flex items-center space-x-2 text-xs font-mono text-black">
            <span class="w-2.5 h-2.5 rounded-full bg-orange-500 animate-ping"></span>
            <span class="text-black font-semibold">Live 5G Ingest:</span>
            <strong class="text-black font-black">${dev.deviceId} (${loc?.city || 'Metro'})</strong>
            <span class="text-orange-500 font-bold">→</span>
            <span class="px-2 py-0.5 rounded text-[10px] font-black ${badge.bg}">AQI ${meas.aqi} (${badge.label})</span>
            <span class="text-orange-300">|</span>
            <span class="text-black font-semibold">PM2.5: <strong class="text-black font-black">${meas.pm25}</strong> µg/m³</span>
            <span class="text-orange-300">|</span>
            <span class="text-[#EA580C] font-black">${dev.latencyMs} ms URLLC</span>
          </div>
        `;
      }
    }

    function buildPopupHtml(dev, loc, meas, badge) {
      return `
        <div style="font-family: inherit; padding: 6px; min-width: 220px; color: #000000; background: #FFFFFF;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
            <span style="font-weight: 900; font-size: 14px; color: #000000;">${loc?.name || dev.name}</span>
            <span style="background: #FFF7ED; color: #EA580C; border: 1.5px solid #FED7AA; font-size: 9px; font-weight: 900; padding: 2px 8px; border-radius: 9999px;">5G URLLC</span>
          </div>
          <div style="font-size: 11px; color: #18181B; font-weight: 600; margin-bottom: 8px;">${dev.deviceId} • ${loc?.city || 'Metro'} (${loc?.type || 'Sector'})</div>
          <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; background: #FFF7ED; border: 1.5px solid #FED7AA; padding: 10px; border-radius: 12px;">
            <span style="font-size: 30px; font-weight: 900; color: #000000; font-family: monospace;">${meas.aqi || 85}</span>
            <span style="font-size: 11px; font-weight: 900; color: ${badge.color}; text-transform: uppercase; background: #FFFFFF; padding: 3px 8px; border-radius: 8px; border: 1px solid #FED7AA;">${badge.label}</span>
          </div>
          <div style="font-size: 11px; border-top: 1.5px solid #FED7AA; padding-top: 8px; line-height: 1.7; color: #000000;">
            PM2.5: <b style="color: #000000;">${meas.pm25 || '--'} µg/m³</b> | PM10: <b style="color: #000000;">${meas.pm10 || '--'} µg/m³</b><br/>
            Temp: <b style="color: #000000;">${meas.temperature || '--'}°C</b> | 5G Latency: <b style="color: #EA580C; font-weight: 900;">${dev.latencyMs}ms</b>
          </div>
        </div>
      `;
    }

    function updateLivePill() {
      const pill = document.getElementById('live-stream-pill');
      if (pill) {
        pill.innerHTML = `
          <span class="w-2.5 h-2.5 rounded-full ${state.liveStreamConnected ? 'bg-orange-500 animate-ping' : 'bg-amber-500'} mr-2"></span>
          <span class="font-mono text-[11px] font-bold text-black">${state.liveStreamConnected ? '5G Telemetry Active' : 'Connecting...'}</span>
        `;
      }
    }

    function updateDashboardLiveElements(meas, dev) {
      const el = document.getElementById(`sensor-item-${dev.deviceId}`);
      if (el) {
        const badge = getAqiBadge(meas.aqi);
        const bEl = el.querySelector('.aqi-badge-slot');
        if (bEl) {
          bEl.className = `px-2 py-0.5 rounded text-[10px] font-mono font-bold aqi-badge-slot ${badge.bg}`;
          bEl.innerText = `AQI ${meas.aqi}`;
        }
        const pEl = el.querySelector('.pm25-slot');
        if (pEl) pEl.innerText = meas.pm25;
      }
    }

    function switchRole(role) {
      const roles = {
        ADMIN: { id: 'usr_admin', name: 'Dr. Aarav Sharma', role: 'ADMIN', department: 'Central Environmental Board' },
        OFFICER: { id: 'usr_officer', name: 'Priya Narayanan', role: 'ENVIRONMENT_OFFICER', department: 'Air Quality Monitoring Cell' },
        RESEARCHER: { id: 'usr_researcher', name: 'Prof. K. Venkatesh', role: 'RESEARCHER', department: 'Atmospheric Physics Lab' },
        VIEWER: { id: 'usr_viewer', name: 'Public Citizen', role: 'VIEWER', department: 'Smart City Resident' }
      };
      state.currentUser = roles[role] || roles.ADMIN;
      renderApp();
    }

    function setTab(tab) {
      state.currentTab = tab;
      renderApp();
    }

    function setCityFilter(city) {
      state.activeCityFilter = city;
      renderApp();
    }

    // Render App Main View
    function renderApp() {
      const app = document.getElementById('app');
      if (!app) return;

      const filteredDevices = state.activeCityFilter === 'ALL'
        ? state.devices
        : state.devices.filter(d => {
            const loc = state.locations.find(l => l.id === d.locationId);
            return loc && loc.city === state.activeCityFilter;
          });

      const activeAlertsCount = state.alerts.filter(a => a.status === 'ACTIVE').length;

      app.innerHTML = `
        <!-- Sidebar Navigation -->
        <aside class="w-64 themed-sidebar flex flex-col justify-between shrink-0 select-none">
          <div>
            <!-- Brand -->
            <div class="p-5 border-b border-[var(--border-color)] flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center text-xl font-bold shadow-lg pulse-glow" style="background: var(--accent-gradient);">
                  ⚡
                </div>
                <div>
                  <h1 class="font-black text-base tracking-tight flex items-center space-x-1 text-black">
                    <span class="text-black">EcoSense</span>
                    <span class="font-mono text-sm themed-accent-text">5G</span>
                  </h1>
                  <p class="text-[10px] text-black uppercase tracking-widest font-black">Environmental AI</p>
                </div>
              </div>
            </div>

            <!-- 5G Status -->
            <div class="mx-4 my-3 px-3.5 py-2.5 rounded-xl themed-inner flex items-center justify-between text-xs">
              <div class="flex items-center space-x-2">
                <span class="w-2.5 h-2.5 rounded-full ${state.liveStreamConnected ? 'bg-orange-500 pulse-glow' : 'bg-amber-500'}"></span>
                <span class="font-black text-xs text-black">5G SA URLLC</span>
              </div>

    function initMiniMap() {
      const container = document.getElementById('mini-map-container');
      if (!container || typeof L === 'undefined') return;

      if (state.miniMap) {
        state.miniMap.remove();
        state.miniMap = null;
      }

      state.miniMap = L.map(container, {
        center: [22.5, 79.5],
        zoom: 5,
        minZoom: 4,
        maxZoom: 18,
        zoomControl: true,
        attributionControl: false
      });

      // Rich, fully visible OpenStreetMap tiles (clear borders, blue oceans, green/tan land)
      state.miniMapTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        subdomains: ['a', 'b', 'c']
      }).addTo(state.miniMap);

      // Prominent Orange Boundary Outline of India
      L.polygon(INDIA_BORDER, {
        color: '#EA580C',
        weight: 3,
        opacity: 0.9,
        fillColor: '#FF6600',
        fillOpacity: 0.05,
        dashArray: '8, 6'
      }).addTo(state.miniMap);

      state.miniMapGroup = L.featureGroup();
      state.miniMapMarkers = {};

      state.devices.forEach(dev => {
        const loc = state.locations.find(l => l.id === dev.locationId);
        if (!loc || !loc.latitude || !loc.longitude) return;

        const aqi = dev.latestMeasurement?.aqi || 85;
        const badge = getAqiBadge(aqi);

        const icon = L.divIcon({
          className: 'custom-aqi-icon',
          html: `<div class="aqi-marker-pin" style="background-color: ${badge.color}">${aqi}</div>`,
          iconSize: [34, 34],
          iconAnchor: [17, 17]
        });

        const m = L.marker([loc.latitude, loc.longitude], { icon });
        m.on('click', () => openStationDeepDive(dev.deviceId));
        state.miniMapGroup.addLayer(m);
        state.miniMapMarkers[dev.deviceId] = m;
      });

      state.miniMapGroup.addTo(state.miniMap);

      // Fit the entire country of India in view
      state.miniMap.fitBounds(INDIA_BOUNDS, { padding: [15, 15] });

      setTimeout(() => {
        if (state.miniMap) {
          state.miniMap.invalidateSize();
          state.miniMap.fitBounds(INDIA_BOUNDS, { padding: [15, 15] });
        }
      }, 250);
    }

    function setMiniMapLayer(type) {
      if (!state.miniMap) return;
      if (state.miniMapTileLayer) state.miniMap.removeLayer(state.miniMapTileLayer);
      const url = type === 'satellite'

    async function handleAiSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('ai-user-input');
      const q = input ? input.value.trim() : '';
      if (!q) return;

      input.value = '';
      state.aiMessages.push({ sender: 'user', text: q });
      renderApp();

      try {
        const res = await fetch(`${API_BASE}/assistant/ask`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q })
        });
        const data = await res.json();
        state.aiMessages.push({ sender: 'assistant', text: data.answer });
      } catch (e) {
        state.aiMessages.push({ sender: 'assistant', text: 'Error querying sensor engine.' });
      }
      renderApp();
    }

              <span class="text-xs font-mono font-bold bg-slate-100 px-3 py-1 rounded-xl border">${r.reportId}</span>
            </div>

            <div class="grid grid-cols-2 gap-3 text-xs bg-slate-50 p-3 rounded-2xl border border-slate-200">
              <div><strong>Station:</strong> ${r.station}</div>
              <div><strong>Location:</strong> ${r.location}</div>
              <div><strong>Period:</strong> ${r.period}</div>
              <div><strong>Sensor Uptime:</strong> ${r.sensorUptime}</div>
            </div>

            <div class="grid grid-cols-4 gap-2 text-center text-xs">
              <div class="p-2.5 rounded-xl bg-emerald-50 border border-emerald-200">
                <span class="text-[10px] text-emerald-800 font-bold block">AVG AQI</span>
                <span class="text-xl font-black text-emerald-700 font-mono">${r.aqiStats?.avg}</span>
              </div>
              <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200">
                <span class="text-[10px] text-slate-600 font-bold block">MIN AQI</span>
                <span class="text-lg font-black text-slate-700 font-mono">${r.aqiStats?.min}</span>
              </div>
              <div class="p-2.5 rounded-xl bg-rose-50 border border-rose-200">
                <span class="text-[10px] text-rose-800 font-bold block">PEAK AQI</span>
                <span class="text-lg font-black text-rose-700 font-mono">${r.aqiStats?.max}</span>
              </div>
              <div class="p-2.5 rounded-xl bg-amber-50 border border-amber-200">
                <span class="text-[10px] text-amber-800 font-bold block">VIOLATIONS</span>
                <span class="text-lg font-black text-amber-700 font-mono">${r.pollutionViolations}</span>
              </div>
            </div>

            <div class="flex justify-between items-center pt-3 border-t border-slate-200 text-xs">
              <span class="text-[11px] text-slate-400 font-mono">Generated: ${new Date(r.generatedAt).toLocaleString()}</span>
              <div class="space-x-2">
                <button onclick="window.print()" class="px-4 py-2 rounded-xl bg-slate-900 text-white font-bold text-xs">🖨 Print / PDF</button>
                <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-slate-800 font-bold text-xs">Close</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function closeModal() {
      const modal = document.getElementById('modal-container');
      if (modal) modal.innerHTML = '';
    }

    // Boot Application with Saved Theme
    function bootApp() {
      applyTheme(state.theme);
      fetchAllData();
      initSSE();
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', bootApp);
    } else {
      bootApp();
    }
  </script>
</body>
</html>
